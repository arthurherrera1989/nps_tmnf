<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Feedback Survey | Tokio Marine Insurance UAE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Noto+Sans:wght@400;500;600&family=Noto+Kufi+Arabic:wght@500;600;700&family=Noto+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tokio Marine NPS web form. Design tokens first, then layout. */
:root{
  --blue:#0F62AC; --navy:#0B3D5C; --ink:#1A2733; --muted:#4E5E6E;
  --light:#EAF4FA; --soft:#F5F7F9; --line:#D9E3EC; --green:#1F7A4D; --green-bg:#E6F4EC;
  --font-head:Montserrat,'Noto Kufi Arabic','Noto Sans',sans-serif;
  --font-body:'Noto Sans','Noto Sans Arabic',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-body);color:var(--ink);background:var(--soft);min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--navy);outline-offset:3px}

header.top{background:#fff;border-bottom:1px solid var(--line);padding:20px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top img{height:56px;width:auto;display:block}
.lang{display:flex;align-items:center;gap:2px;direction:ltr}
.lang button{border:none;background:none;min-height:44px;padding:0 6px;font-size:13px;color:var(--muted);font-weight:500}
.lang button[aria-pressed="true"]{color:var(--navy);font-weight:700}
.lang span{color:#B9CBDC}

.shell{display:flex;flex-direction:column;flex:1}
.hero{background:var(--blue);color:#fff;padding:26px 20px 64px;border-radius:0 0 28px 28px;display:flex;flex-direction:column;gap:18px}
.chip{align-self:flex-start;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border-radius:999px;padding:6px 14px 6px 10px;font-size:13px;font-weight:500}
[dir=rtl] .chip{padding:6px 10px 6px 14px}
.chip b{font-weight:600;direction:ltr;unicode-bidi:isolate}
.progress{display:flex;align-items:center;gap:12px}
.progress .label{font-size:14px;font-weight:600;white-space:nowrap}
.segs{display:flex;gap:6px;flex:1;max-width:220px}
.segs i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.3)}
.segs i.on{background:#fff}
.headline{margin:0;font-family:var(--font-head);font-weight:600;font-size:27px;line-height:1.3}
.sub{margin:0;font-size:15px;line-height:1.55;color:rgba(255,255,255,.88);max-width:420px}

.formcol{display:flex;flex-direction:column;gap:14px;padding:0 16px 18px}
.card{margin-top:-40px;background:#fff;border-radius:20px;padding:22px 18px 18px;box-shadow:0 1px 2px rgba(11,61,92,.08),0 14px 34px rgba(11,61,92,.14);display:flex;flex-direction:column;gap:18px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;border:0;margin:0;padding:0}
.tile{height:60px;border:none;border-radius:14px;font-family:var(--font-head);font-size:20px;font-weight:600;padding:0;transition:transform .12s ease}
.tile:active{transform:scale(.94)}
.tile[aria-pressed="true"]{background:var(--navy)!important;color:#fff!important;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--navy)}
.ends{display:flex;justify-content:space-between;gap:16px;font-size:13px;line-height:1.35;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 4px;border:none;background:none;color:var(--blue);font-size:15px;font-weight:600}
[dir=rtl] .back svg{transform:scaleX(-1)}
.backrow{border-top:1px solid #E3EAF1;padding-top:6px}

.answers{display:flex;flex-direction:column;gap:14px}
.answers h2{margin:0;font-family:var(--font-head);font-weight:600;font-size:16px;color:var(--navy)}
.row .meta{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:#33475B;margin-bottom:7px}
.row .meta b{font-family:var(--font-head);font-weight:600;color:var(--navy)}
.bar{height:8px;border-radius:4px;background:#E3EFF9}
.bar i{display:block;height:8px;border-radius:4px;background:var(--blue)}
.talk{display:flex;flex-direction:column;gap:10px;background:var(--light);border-radius:14px;padding:16px}
.talk p{margin:0;display:flex;align-items:center;gap:10px;font-size:15px;line-height:1.4;color:var(--navy)}
.talk a{display:flex;align-items:center;justify-content:center;height:52px;border-radius:999px;background:var(--blue);color:#fff;font-size:16px;font-weight:600;text-decoration:none}
.note{font-size:14px;color:var(--muted)}
.privacy{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.4;color:var(--muted);max-width:520px}
[hidden]{display:none!important}

footer.bottom{padding:14px 20px 22px;display:flex;justify-content:center;border-top:1px solid var(--line);background:#fff}
footer.bottom img{height:34px;width:auto;display:block}

@media (min-width:820px){
  .shell{flex-direction:row}
  .hero{flex:0 0 44%;padding:72px 56px;border-radius:0;justify-content:center;gap:24px}
  .headline{font-size:38px;line-height:1.25}
  .formcol{flex:1;padding:48px;justify-content:center;align-items:center}
  .card{margin-top:0;width:100%;max-width:520px;padding:32px 30px 26px}
}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>

<script>
/* ------------------------------------------------------------------
   CONFIG. This is the part IT changes.
   ------------------------------------------------------------------ */
var CONFIG = {
  // Scale. NPS standard is 0 to 10. The approved design shows 1 to 10.
  // With min 0 there are 11 tiles and the grid switches to 6 columns.
  SCALE_MIN: 1,
  SCALE_MAX: 10,

  // Where the answers are sent (CRM endpoint). Leave empty to only log to the console.
  // The page sends a JSON POST: { token, type, ref, lang, q1, q2, q3, band, submittedAt }
  SUBMIT_URL: '',

  // Promoter and detractor limits for question 1, on the scale above.
  PROMOTER_MIN: 9,   // 9 and 10
  PASSIVE_MIN: 7     // 7 and 8. Anything below is a detractor.
};

/* ------------------------------------------------------------------
   URL parameters, set by the CRM when it builds the SMS link:
   ?t=<random token>  &type=policy|claim  &ref=<policy or claim number>  &lang=en|ar
   Without parameters the page shows demo values.
   ------------------------------------------------------------------ */
var params = new URLSearchParams(location.search);
var TOKEN = params.get('t') || '';
var TYPE = params.get('type') === 'claim' ? 'claim' : 'policy';
var REF = params.get('ref') || (TYPE === 'claim' ? 'C-10-4-1006-2026-5439' : 'P-100-7101-2026-40');
var lang = params.get('lang') === 'ar' ? 'ar' : 'en';

/* ------------------------------------------------------------------
   Copy. Arabic text must be reviewed by a native speaker and by
   Tokio Marine compliance before launch.
   ------------------------------------------------------------------ */
var COPY = {
  en: {
    refText: TYPE === 'claim' ? 'Claim number' : 'Policy number',
    progress: function (i) { return 'Question ' + i + ' of 3'; },
    sub: function (min, max) { return 'Please select a score from ' + min + ' to ' + max + '. The survey takes less than one minute.'; },
    questions: [
      { text: 'How likely are you to recommend Tokio Marine Insurance UAE to a friend or colleague?', short: 'Likelihood to recommend', low: 'not at all likely', high: 'extremely likely' },
      { text: 'How satisfied are you with your overall experience?', short: 'Overall satisfaction', low: 'very dissatisfied', high: 'very satisfied' },
      TYPE === 'claim'
        ? { text: 'How easy was it to submit your claim?', short: 'Ease of submitting your claim', low: 'very difficult', high: 'very easy' }
        : { text: 'How easy was it to obtain your policy?', short: 'Ease of obtaining your policy', low: 'very difficult', high: 'very easy' }
    ],
    lowEnd: function (min, t) { return min + ' = ' + t.charAt(0).toUpperCase() + t.slice(1); },
    highEnd: function (max, t) { return max + ' = ' + t.charAt(0).toUpperCase() + t.slice(1); },
    score: 'Score ',
    group: function (min, max, a, b) { return 'Select a score from ' + min + ' (' + a + ') to ' + max + ' (' + b + ').'; },
    back: 'Back', answers: 'Your responses',
    outOf: function (s, max) { return s + ' out of ' + max; },
    doneDefault: 'Thank you for your feedback.',
    donePromoter: 'Thank you for your feedback. We are pleased to have served you.',
    donePassive: 'Thank you for your feedback. We are committed to improving our service.',
    doneDetractor: 'Thank you for your feedback. We apologise that we did not meet your expectations.',
    textDetractor: 'A member of our team will contact you within 48 hours.',
    textOther: 'Your feedback helps us to continually improve the service we provide.',
    talkQ: 'Would you like to speak with us now?', talk: 'Speak to our team',
    close: 'You may now close this page.',
    privacy: 'Your responses are used solely to improve our services.'
  },
  ar: {
    refText: TYPE === 'claim' ? 'رقم المطالبة' : 'رقم وثيقة التأمين',
    progress: function (i) { return 'السؤال ' + i + ' من 3'; },
    sub: function (min, max) { return 'يُرجى اختيار درجة من ' + min + ' إلى ' + max + '. يستغرق الاستبيان أقل من دقيقة.'; },
    questions: [
      { text: 'ما مدى احتمال أن توصي بشركة طوكيو مارين للتأمين في الإمارات لصديق أو زميل؟', short: 'احتمال التوصية', low: 'غير محتمل إطلاقاً', high: 'محتمل للغاية' },
      { text: 'ما مدى رضاك عن تجربتك العامة؟', short: 'الرضا العام', low: 'غير راضٍ تماماً', high: 'راضٍ للغاية' },
      TYPE === 'claim'
        ? { text: 'ما مدى سهولة تقديم مطالبتك؟', short: 'سهولة تقديم المطالبة', low: 'صعب للغاية', high: 'سهل للغاية' }
        : { text: 'ما مدى سهولة الحصول على وثيقة التأمين؟', short: 'سهولة الحصول على الوثيقة', low: 'صعب للغاية', high: 'سهل للغاية' }
    ],
    lowEnd: function (min, t) { return min + ' تعني ' + t; },
    highEnd: function (max, t) { return max + ' تعني ' + t; },
    score: 'الدرجة ',
    group: function (min, max, a, b) { return 'يُرجى اختيار درجة من ' + min + ' (' + a + ') إلى ' + max + ' (' + b + ').'; },
    back: 'السابق', answers: 'إجاباتك',
    outOf: function (s, max) { return s + ' من ' + max; },
    doneDefault: 'نشكرك على ملاحظاتك القيّمة.',
    donePromoter: 'نشكرك على ملاحظاتك القيّمة. يسرّنا أن نكون قد قدّمنا لك خدمة مرضية.',
    donePassive: 'نشكرك على ملاحظاتك. نلتزم بمواصلة تطوير خدماتنا.',
    doneDetractor: 'نشكرك على ملاحظاتك. نعتذر عن عدم تلبية توقعاتك.',
    textDetractor: 'سيتواصل معك أحد أعضاء فريقنا خلال 48 ساعة.',
    textOther: 'تساعدنا ملاحظاتك على تطوير خدماتنا بشكل مستمر.',
    talkQ: 'هل ترغب في التحدث إلينا الآن؟', talk: 'تحدث إلى فريقنا',
    close: 'يمكنك الآن إغلاق هذه الصفحة.',
    privacy: 'تُستخدم إجاباتك لغرض تحسين خدماتنا فقط.'
  }
};

/* ------------------------------------------------------------------
   Logic
   ------------------------------------------------------------------ */
var KEYS = ['q1', 'q2', 'q3'];
var answers = {};
var step = 0;            // 0, 1, 2 = questions, 3 = thank you
var RAMP10 = ['#EAF4FA', '#DBEAF6', '#C9DFF1', '#B3D1EA', '#9FC3E4', '#8DB7DC', '#74A5D4', '#3F7FBE', '#2570B6', '#0F62AC'];

function $(id) { return document.getElementById(id); }

function mix(a, b, t) {
  var pa = [1, 3, 5].map(function (i) { return parseInt(a.substr(i, 2), 16); });
  var pb = [1, 3, 5].map(function (i) { return parseInt(b.substr(i, 2), 16); });
  return '#' + pa.map(function (v, i) {
    var x = Math.round(v + (pb[i] - v) * t).toString(16);
    return x.length < 2 ? '0' + x : x;
  }).join('');
}
function tileColor(index, count) {
  if (count === 10) return RAMP10[index];
  return mix('#EAF4FA', '#0F62AC', Math.pow(index / (count - 1), 1.35));
}

function band(q1) {
  if (q1 === undefined) return 'none';
  if (q1 >= CONFIG.PROMOTER_MIN) return 'promoter';
  if (q1 >= CONFIG.PASSIVE_MIN) return 'passive';
  return 'detractor';
}

function render() {
  var c = COPY[lang];
  var min = CONFIG.SCALE_MIN, max = CONFIG.SCALE_MAX;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  $('btn-en').setAttribute('aria-pressed', lang === 'en');
  $('btn-ar').setAttribute('aria-pressed', lang === 'ar');
  $('ref-text').textContent = c.refText;
  $('ref-id').textContent = REF;
  $('privacy-text').textContent = c.privacy;

  var done = step > 2;
  $('view-question').hidden = done;
  $('view-done').hidden = !done;
  $('progress').hidden = done;

  if (!done) {
    var q = c.questions[step];
    $('progress-label').textContent = c.progress(step + 1);
    Array.prototype.forEach.call($('segs').children, function (el, i) { el.className = i <= step ? 'on' : ''; });
    $('headline').textContent = q.text;
    $('subline').textContent = c.sub(min, max);
    $('scale-legend').textContent = c.group(min, max, q.low, q.high);
    $('end-low').textContent = c.lowEnd(min, q.low);
    $('end-high').textContent = c.highEnd(max, q.high);
    $('backrow').hidden = step === 0;
    $('back-text').textContent = c.back;

    var count = max - min + 1;
    var grid = $('scale');
    grid.style.gridTemplateColumns = 'repeat(' + (count > 10 ? 6 : 5) + ',1fr)';
    Array.prototype.slice.call(grid.querySelectorAll('button')).forEach(function (b) { grid.removeChild(b); });
    for (var n = min; n <= max; n++) {
      (function (n) {
        var i = n - min;
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'tile';
        b.textContent = n;
        b.setAttribute('aria-label', c.score + n);
        b.setAttribute('aria-pressed', answers[KEYS[step]] === n ? 'true' : 'false');
        b.style.background = tileColor(i, count);
        b.style.color = (i / (count - 1)) >= 0.7 ? '#fff' : '#0B3D5C';
        b.addEventListener('click', function () { pick(n, b); });
        grid.appendChild(b);
      })(n);
    }
  } else {
    var bd = band(answers.q1);
    var title = c.doneDefault;
    if (bd === 'promoter') title = c.donePromoter;
    if (bd === 'passive') title = c.donePassive;
    if (bd === 'detractor') title = c.doneDetractor;
    $('headline').textContent = title;
    $('subline').textContent = bd === 'detractor' ? c.textDetractor : c.textOther;
    $('answers-title').textContent = c.answers;
    var rows = $('answers-rows');
    rows.innerHTML = '';
    KEYS.forEach(function (k, i) {
      if (answers[k] === undefined) return;
      var row = document.createElement('div');
      row.className = 'row';
      var pct = (answers[k] / max) * 100;
      row.innerHTML = '<div class="meta"><span></span><b></b></div><div class="bar"><i></i></div>';
      row.querySelector('span').textContent = c.questions[i].short;
      row.querySelector('b').textContent = c.outOf(answers[k], max);
      row.querySelector('i').style.width = pct + '%';
      rows.appendChild(row);
    });
    $('talk').hidden = bd !== 'detractor';
    $('talk-q').textContent = c.talkQ;
    $('talk-btn').textContent = c.talk;
    $('close-note').textContent = c.close;
  }
}

function pick(n, btn) {
  answers[KEYS[step]] = n;
  // Show the selected state for a moment, then move on.
  Array.prototype.forEach.call($('scale').children, function (el) {
    if (el.tagName === 'BUTTON') el.setAttribute('aria-pressed', el === btn ? 'true' : 'false');
  });
  setTimeout(function () {
    step += 1;
    if (step > 2) submit();
    render();
  }, 260);
}

function submit() {
  var payload = {
    token: TOKEN, type: TYPE, ref: REF, lang: lang,
    q1: answers.q1, q2: answers.q2, q3: answers.q3,
    band: band(answers.q1),
    submittedAt: new Date().toISOString()
  };
  if (!CONFIG.SUBMIT_URL) { console.log('NPS payload (no SUBMIT_URL set):', payload); return; }
  fetch(CONFIG.SUBMIT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
    keepalive: true
  }).catch(function (e) { console.error('NPS submit failed', e); });
}

$('btn-back').addEventListener('click', function () { if (step > 0) { step -= 1; render(); } });
$('btn-en').addEventListener('click', function () { lang = 'en'; render(); });
$('btn-ar').addEventListener('click', function () { lang = 'ar'; render(); });

render();
